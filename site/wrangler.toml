# stooks.xyz — the Stook Street app (built from apps/stook) plus the data
# routes in worker.js (/prices, /chart).
#   pnpm -F @stook/app build && cd site && npx wrangler deploy
name = "stook-street"
main = "worker.js"
compatibility_date = "2026-08-01"
assets = { directory = "../apps/stook/dist", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = ["/prices", "/chart", "/usd", "/coins", "/supply", "/tape/*"] }
routes = [
  { pattern = "stooks.xyz", custom_domain = true },
  { pattern = "www.stooks.xyz", custom_domain = true },
]

[[kv_namespaces]]
binding = "SERIES"
id = "a9bb0c3390bb486d969c2a16f946fe73"
