# stookstreet.xyz: the Stook Street app (built from apps/stook) plus the data
# routes in worker.js. stooks.xyz, the old name, redirects its pages here and
# still answers the data routes (the VPS and aggregators call them).
#   pnpm -F @stook/app build && cd site && npx wrangler deploy
name = "stook-street"
main = "worker.js"
compatibility_date = "2026-08-01"
assets = { directory = "../apps/stook/dist", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = true }
routes = [
  { pattern = "stookstreet.xyz", custom_domain = true },
  { pattern = "www.stookstreet.xyz", custom_domain = true },
  { pattern = "stooks.xyz", custom_domain = true },
  { pattern = "www.stooks.xyz", custom_domain = true },
]

# The floor's AI chatter: Workers AI (free allowance), refreshed hourly.
[ai]
binding = "AI"

[triggers]
# The X posts (the morning question, the closing bell) are off for now:
# they are posted by hand with the poster studio's videos. To turn them back
# on, add "35 13,14 * * 1-5" and "10 20,21 * * 1-5" here.
crons = ["7 * * * *", "*/5 * * * *"]

[[kv_namespaces]]
binding = "SERIES"
id = "a9bb0c3390bb486d969c2a16f946fe73"
