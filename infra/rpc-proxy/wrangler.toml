name = "stook-rpc-devnet"
main = "src/index.js"
compatibility_date = "2026-08-01"

# The upstream RPC URL (with its API key) lives in a secret, never in code:
#   wrangler secret put UPSTREAM_RPC

# 300 requests per 10 s per client address; the keeper sends a few a second.
[[ratelimits]]
name = "LIMITER"
namespace_id = "7001"
simple = { limit = 300, period = 10 }

# Mainnet, for the site's browsers: wrangler deploy --env mainnet
[env.mainnet]
name = "stook-rpc-mainnet"
[env.mainnet.vars]
ORIGINS = "https://stookstreet.xyz,https://www.stookstreet.xyz"
PASS_WS = "1"
SCAN_CACHE_SECS = "20"
[[env.mainnet.ratelimits]]
name = "LIMITER"
namespace_id = "7002"
simple = { limit = 60, period = 10 }
