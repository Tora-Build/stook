<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges" width="512" height="512">
  <!-- $STOOK — a pixel street sign at the corner of Stook Street. 64×64 grid. -->
  <rect width="64" height="64" fill="#101a2e"/>
  <!-- night sky stars -->
  <g fill="#f4e9c8"><rect x="9" y="7" width="1" height="1"/><rect x="52" y="10" width="1" height="1"/><rect x="20" y="13" width="1" height="1"/><rect x="45" y="5" width="1" height="1"/><rect x="58" y="20" width="1" height="1"/></g>
  <!-- skyline silhouette -->
  <g fill="#1b2a47">
    <rect x="0" y="40" width="9" height="24"/><rect x="9" y="34" width="6" height="30"/><rect x="15" y="44" width="5" height="20"/>
    <rect x="20" y="30" width="7" height="34"/><rect x="27" y="38" width="4" height="26"/><rect x="31" y="26" width="6" height="38"/>
    <rect x="33" y="21" width="2" height="6"/><rect x="37" y="36" width="8" height="28"/><rect x="45" y="42" width="5" height="22"/>
    <rect x="50" y="32" width="7" height="32"/><rect x="57" y="39" width="7" height="25"/>
  </g>
  <!-- lit windows -->
  <g fill="#f0a83a">
    <rect x="2" y="43" width="1" height="1"/><rect x="5" y="46" width="1" height="1"/><rect x="11" y="37" width="1" height="1"/><rect x="12" y="41" width="1" height="1"/>
    <rect x="22" y="33" width="1" height="1"/><rect x="24" y="36" width="1" height="1"/><rect x="22" y="40" width="1" height="1"/><rect x="33" y="30" width="1" height="1"/>
    <rect x="35" y="34" width="1" height="1"/><rect x="39" y="39" width="1" height="1"/><rect x="42" y="42" width="1" height="1"/><rect x="52" y="35" width="1" height="1"/>
    <rect x="54" y="38" width="1" height="1"/><rect x="52" y="44" width="1" height="1"/><rect x="60" y="42" width="1" height="1"/><rect x="59" y="47" width="1" height="1"/>
  </g>
  <!-- street -->
  <rect x="0" y="58" width="64" height="6" fill="#2a2a30"/>
  <g fill="#f0a83a"><rect x="4" y="61" width="5" height="1"/><rect x="16" y="61" width="5" height="1"/><rect x="28" y="61" width="5" height="1"/><rect x="40" y="61" width="5" height="1"/><rect x="52" y="61" width="5" height="1"/></g>
  <!-- sign pole -->
  <rect x="31" y="22" width="2" height="36" fill="#8a8f99"/><rect x="30" y="57" width="4" height="1" fill="#5c6270"/>
  <!-- the sign: NYC green, white border -->
  <rect x="8" y="16" width="48" height="14" fill="#f4e9c8"/>
  <rect x="9" y="17" width="46" height="12" fill="#0f7a4d"/>
  <!-- STOOK in 5px pixel caps: S T O O K -->
  <g fill="#f4e9c8">
    <!-- S -->
    <rect x="12" y="19" width="4" height="1"/><rect x="12" y="20" width="1" height="1"/><rect x="12" y="21" width="4" height="1"/><rect x="15" y="22" width="1" height="1"/><rect x="12" y="23" width="4" height="1"/>
    <!-- T -->
    <rect x="18" y="19" width="5" height="1"/><rect x="20" y="20" width="1" height="4"/>
    <!-- O -->
    <rect x="25" y="19" width="4" height="1"/><rect x="25" y="20" width="1" height="3"/><rect x="28" y="20" width="1" height="3"/><rect x="25" y="23" width="4" height="1"/>
    <!-- O -->
    <rect x="31" y="19" width="4" height="1"/><rect x="31" y="20" width="1" height="3"/><rect x="34" y="20" width="1" height="3"/><rect x="31" y="23" width="4" height="1"/>
    <!-- K -->
    <rect x="37" y="19" width="1" height="5"/><rect x="40" y="19" width="1" height="1"/><rect x="39" y="20" width="1" height="1"/><rect x="38" y="21" width="1" height="1"/><rect x="39" y="22" width="1" height="1"/><rect x="40" y="23" width="1" height="1"/>
    <!-- ST (small) -->
    <rect x="44" y="19" width="3" height="1"/><rect x="44" y="20" width="1" height="1"/><rect x="44" y="21" width="3" height="1"/><rect x="46" y="22" width="1" height="1"/><rect x="44" y="23" width="3" height="1"/>
    <rect x="48" y="19" width="3" height="1"/><rect x="49" y="20" width="1" height="4"/>
    <!-- arrow under: the line going up -->
    <rect x="12" y="26" width="1" height="1"/><rect x="13" y="26" width="1" height="1"/><rect x="14" y="25" width="1" height="1"/><rect x="15" y="25" width="1" height="1"/><rect x="16" y="26" width="1" height="1"/><rect x="17" y="25" width="1" height="1"/><rect x="18" y="24" width="1" height="1"/>
  </g>
  <g fill="#f0a83a"><rect x="19" y="25" width="1" height="1"/><rect x="20" y="24" width="1" height="1"/><rect x="21" y="25" width="1" height="1"/><rect x="22" y="24" width="1" height="1"/><rect x="23" y="25" width="1" height="1"/><rect x="24" y="24" width="1" height="1"/></g>
</svg>
