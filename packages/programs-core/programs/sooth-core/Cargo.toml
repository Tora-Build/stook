[package]
name = "sooth_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "sooth_core"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
# Suppresses solana_program's default 32 KB BumpAllocator so sooth_core can
# install a 256 KB heap (see lib.rs). ON BY DEFAULT so the artifact under test
# is the artifact deployed. Callers MUST send request_heap_frame(256 * 1024).
custom-heap = []
default = ["custom-heap"]
mainnet = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
# `#[account(zero_copy)]` for `Ladder` and `LadderTranche`.
bytemuck = { version = "1.16", features = ["derive", "min_const_generics"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022", "associated_token"] }
